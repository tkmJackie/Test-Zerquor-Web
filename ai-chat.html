<div class="ai-chat" id="ai-chat">

  <!-- 開閉ボタン -->

<button
  class="ai-chat-button"
  id="ai-chat-button"
  type="button"
>
  相談AI
</button>

  <!-- チャットウィンドウ -->

  <div
    class="ai-chat-window"
    id="ai-chat-window"
  >

    <!-- ヘッダー -->

    <div class="ai-chat-header">

      <div class="ai-chat-title">

          <strong>
            Zerquor AI
          </strong>

          <div class="ai-status">
            セキュリティアシスタント
          </div>

        </div>

      </div>

      <button
        id="ai-chat-close"
        class="ai-chat-close"
        type="button"
      >
        ✕
      </button>

    </div>

    <!-- メッセージ -->

    <div
      class="ai-chat-messages"
      id="ai-chat-messages"
    >

      <div class="ai-message">

        こんにちは。

        セキュリティ研修、
        内製化支援、
        セミナー情報など
        お気軽にご相談ください。

      </div>

    </div>

    <!-- 入力欄 -->

    <form
      id="ai-chat-form"
      class="ai-chat-form"
    >

      <input
        type="text"
        id="ai-chat-input"
        placeholder="質問を入力してください"
        autocomplete="off"
      >

      <button type="submit">
        送信
      </button>

    </form>

  </div>

</div>
