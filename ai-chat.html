<div class="ai-chat" id="ai-chat">
  <button
    class="ai-chat-button"
    id="ai-chat-button"
    type="button"
  >
    AIに相談
  </button>

  <div class="ai-chat-window" id="ai-chat-window">
    <div class="ai-chat-header">
      <strong>Zerquor AI</strong>

      <button
        id="ai-chat-close"
        class="ai-chat-close"
        type="button"
      >
        ×
      </button>
    </div>

    <div
      class="ai-chat-messages"
      id="ai-chat-messages"
    >
      <div class="ai-row">
        <div class="ai-avatar">
          <img
            src="images/logo.png"
            alt="Zerquor"
          >
        </div>

        <div class="ai-message">
          こんにちは。セキュリティ研修・内製化支援・セミナー情報など、お気軽にご相談ください。
        </div>
      </div>
    </div>

    <form
      id="ai-chat-form"
      class="ai-chat-form"
    >
      <input
        id="ai-chat-input"
        type="text"
        placeholder="質問を入力してください"
        autocomplete="off"
      >

      <button type="submit">
        送信
      </button>
    </form>
  </div>
</div>
