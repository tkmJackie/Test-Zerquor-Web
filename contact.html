<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>お問い合わせ | 合同会社Zerquor</title>
  <meta name="description" content="合同会社Zerquorへのお問い合わせページ。セキュリティ相談、研修、ルール整備、業務提携などはこちらからご相談ください。" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="images/logo.png">
</head>

<body>
  
  <div id="header"></div>
  <main>
    <section class="page-hero">
      <div class="container fade-up">
        <div class="eyebrow">Contact</div>
        <h1>お問い合わせ</h1>
        <p>
          「何から始めればよいか分からない」という段階でも問題ありません。
          現在の状況を伺い、必要な対策の優先順位を一緒に整理します。
        </p>
      </div>
    </section>

    <section class="contact-section">
      <div class="container">
        <div class="contact-box fade-up">
          <div class="contact-grid">
            <div>
              <h2>まずは無料でご相談ください。</h2>
              <p>
                セキュリティ現状把握、従業員研修、社内ルール整備、月額相談、業務提携など、
                お気軽にお問い合わせください。
              </p>

              <ul class="check-list contact-check">
                <li>専任担当者がいない企業様も相談可能</li>
                <li>高額な製品導入を前提にしない</li>
                <li>現状把握・教育・ルール整備から小さく開始</li>
              </ul>
            </div>
            <div id="cta"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <div id="ai-chat-container"></div>
  
  <script src="script.js"></script>
</body>
</html>
